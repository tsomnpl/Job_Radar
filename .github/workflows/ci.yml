name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run lint
      - run: npm run build
